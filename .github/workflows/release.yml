name: Publish companion
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/verify_release.py --tag "$GITHUB_REF_NAME"
      - run: python3 -m unittest discover -s tests -v
      - name: Read reviewed public image identity
        run: |
          echo "IMAGE=$(python3 -c 'import json; print(json.load(open("echomuse_household_voice/config.json"))["image"])')" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build exact Supervisor version tag
        run: docker build --platform linux/amd64 --build-arg "BUILD_VERSION=$VERSION" -t "$IMAGE:$VERSION" ./echomuse_household_voice
      - name: Verify derived image before publishing
        run: >-
          docker run --rm --network none --user 65532:65532 --cap-drop ALL
          --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,mode=1777,size=256m
          --memory 1g --cpus 2 -e PYTHONPATH=/app -e PYTHONDONTWRITEBYTECODE=1 -e SERVER_IP=192.0.2.1
          -v "$PWD/tests/image_smoke.py:/smoke/image_smoke.py:ro"
          --entrypoint python "$IMAGE:$VERSION" /smoke/image_smoke.py
      - name: Publish using the repository-scoped token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker logout ghcr.io
      - name: Verify public access and record immutable digest
        run: |
          docker pull "$IMAGE:$VERSION"
          mkdir -p dist
          docker inspect --format '{{json .RepoDigests}}' "$IMAGE:$VERSION" > dist/image-digests.json
          cp upstream-pin.json PUBLIC-RELEASE-MANIFEST.json dist/
      - name: Publish release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/image-digests.json dist/upstream-pin.json dist/PUBLIC-RELEASE-MANIFEST.json --verify-tag --generate-notes
